<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Meital's Math Quest</title>
  <meta name="description" content="Adaptive, mastery-based Grade 7 math practice for Meital." />

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#7c5cff" />

  <!-- iOS home screen / standalone app support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Math Quest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧮</text></svg>" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <header id="app-header">
      <div class="brand">
        <div class="brand-emoji">🧮</div>
        <div>
          <div class="brand-title">Meital's Math Quest</div>
          <div class="brand-sub">Grade 7 · Mastery-Based Adaptive Practice</div>
        </div>
        <div class="squish-mascot" id="squish-mascot" title="Boop me!"></div>
      </div>
      <div class="stat-row" id="header-stats"></div>
    </header>
    <nav id="app-nav" class="hidden"></nav>
    <main id="app-main"></main>
  </div>

  <script src="js/questions.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (e) { console.warn('SW registration failed', e); });
      });
    }
  </script>
</body>
</html>
